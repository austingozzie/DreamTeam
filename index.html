<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamteam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent2: #58a6ff;
    --danger: #f85149;
    --gold: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .hamburger {
    width: 34px; height: 34px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .hamburger span { width: 16px; height: 2px; background: var(--text); border-radius: 2px; }
  header h1 {
    font-size: 19px;
    margin: 0;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .userbox { font-size: 13px; color: var(--muted); }
  .userbox b { color: var(--text); }
  .mode-menu {
    position: absolute;
    top: 56px;
    left: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    z-index: 30;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .mode-menu button {
    display: block;
    width: 180px;
    padding: 12px 14px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }
  .mode-menu button:hover { background: #1c2430; }
  .mode-menu button + button { border-top: 1px solid var(--border); }
  nav.mode-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    overflow-x: auto;
  }
  nav.mode-nav button {
    flex: 1;
    padding: 12px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.mode-nav button.active { color: var(--text); border-bottom-color: var(--accent2); }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .game {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .game-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .pick-row { display: flex; gap: 8px; }
  .pick-btn {
    flex: 1;
    padding: 10px;
    background: #161b22;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .pick-btn b { display: block; font-size: 14px; }
  .pick-btn.selected { border-color: var(--accent2); background: rgba(88,166,255,0.15); }
  .pick-btn.locked { opacity: 0.5; cursor: not-allowed; }
  .pick-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .pick-btn.win { border-color: var(--accent); background: rgba(63,185,80,0.15); }
  .pick-btn.loss { border-color: var(--danger); background: rgba(248,81,73,0.12); }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  .tag.locked { background: #30363d; color: var(--muted); }
  input, select {
    width: 100%;
    padding: 10px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 8px;
  }
  button.primary {
    padding: 10px 16px;
    background: var(--accent2);
    border: none;
    border-radius: 8px;
    color: #0d1117;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button.secondary {
    padding: 8px 12px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .rank { color: var(--gold); font-weight: 700; }
  .center { text-align: center; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .week-nav span { font-weight: 600; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
  .admin-game-row { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .hidden { display: none !important; }

  /* Survivor-specific */
  .survivor-sheet-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 14px;
  }
  .survivor-card {
    min-width: 84px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
    flex-shrink: 0;
  }
  .survivor-card.win { border-color: var(--accent); }
  .survivor-card.loss { border-color: var(--danger); }
  .sc-week { font-size: 11px; color: var(--muted); }
  .sc-team { font-size: 13px; font-weight: 600; margin: 6px 0; min-height: 18px; }
  .survivor-card button { width: 100%; padding: 6px; font-size: 11px; }
  .status-banner { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .field-scroll { overflow-x: auto; }
  #survivorFieldTable table { font-size: 12px; white-space: nowrap; }
  #survivorFieldTable th, #survivorFieldTable td { padding: 6px 8px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <button class="hamburger" onclick="toggleModeMenu()"><span></span><span></span><span></span></button>
    <h1 id="appTitle">Dreamteam Picks</h1>
  </div>
  <div class="userbox" id="userbox"></div>
</header>

<div id="modeMenu" class="mode-menu hidden">
  <button onclick="setMode('picks')">Picks</button>
  <button onclick="setMode('survivor')">Survivor</button>
  <button onclick="setMode('commish')">Commish</button>
</div>

<nav id="pickNav" class="mode-nav">
  <button data-tab="picks" class="active">Picks</button>
  <button data-tab="leaderboard">Leaderboard</button>
</nav>

<nav id="survivorNav" class="mode-nav hidden">
  <button data-tab="survivorMy" class="active">My Picks</button>
  <button data-tab="survivorField">Field</button>
</nav>

<main>

  <!-- LOGIN -->
  <div id="loginScreen" class="card">
    <h3 style="margin-top:0">Enter your username</h3>
    <input id="loginInput" placeholder="username" autocomplete="off">
    <button class="primary" onclick="login()">Enter</button>
  </div>

  <!-- ============ PICKS MODE ============ -->
  <div id="picksTab" class="hidden">
    <div class="week-nav">
      <button class="secondary" onclick="changeWeek(-1)">&larr;</button>
      <span id="weekLabel">Week -</span>
      <button class="secondary" onclick="changeWeek(1)">&rarr;</button>
    </div>
    <div id="gamesList"></div>
  </div>

  <div id="leaderboardTab" class="hidden">
    <div class="card">
      <table id="leaderboardTable">
        <thead><tr><th>#</th><th>Member</th><th class="center">Pts</th><th class="center">Record</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- ============ SURVIVOR MODE ============ -->
  <div id="survivorMyTab" class="hidden">
    <div id="survivorNoLogin" class="card hidden">
      <p style="margin:0;color:var(--muted)">Log in above to make survivor picks.</p>
    </div>
    <div id="survivorMyContent" class="hidden">
      <div class="status-banner" id="survivorStatusBanner"></div>
      <div class="survivor-sheet-scroll" id="survivorSheet"></div>

      <div id="survivorPicker" class="card hidden">
        <div class="week-nav">
          <span id="survivorPickerWeekLabel">Week -</span>
          <button class="secondary" onclick="cancelSurvivorEdit()">Cancel</button>
        </div>
        <div id="survivorGamesList"></div>
        <button class="primary" onclick="saveSurvivorPick()">Save pick</button>
      </div>
    </div>
  </div>

  <div id="survivorFieldTab" class="hidden">
    <div class="card field-scroll">
      <div id="survivorFieldTable"></div>
    </div>
  </div>

  <!-- ============ COMMISH MODE ============ -->
  <div id="adminTab" class="hidden">
    <div id="adminLocked" class="card">
      <h3 style="margin-top:0">Commish login</h3>
      <input id="adminPass" type="password" placeholder="password">
      <button class="primary" onclick="adminLogin()">Unlock</button>
    </div>
    <div id="adminPanel" class="hidden">
      <div class="card">
        <h3 style="margin-top:0">Import week from ESPN</h3>
        <div class="week-nav">
          <button class="secondary" onclick="changeAdminWeek(-1)">&larr;</button>
          <span id="adminWeekLabel">Week -</span>
          <button class="secondary" onclick="changeAdminWeek(1)">&rarr;</button>
        </div>
        <button class="primary" onclick="importEspnWeek()">Fetch NFL games for this week</button>
        <div id="importStatus" style="font-size:13px;color:var(--muted);margin-top:8px;"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Games this week (edit spreads)</h3>
        <div id="adminGamesList"></div>
        <button class="primary" onclick="saveSpreads()">Save spreads</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Refresh live scores &amp; grade</h3>
        <p style="font-size:12px;color:var(--muted);margin-top:0">Feeds both Picks and Survivor scoring — one games table, shared.</p>
        <button class="primary" onclick="refreshScoresAndGrade()">Fetch scores + grade this week</button>
        <div id="gradeStatus" style="font-size:13px;color:var(--muted);margin-top:8px;"></div>
      </div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://gzrnmygfznageqcdlefr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_S1q03LvKykbtBcCCIkf8ng_5Ct3P3x4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ADMIN_PASSWORD = "ComGoz8";
const SEASON_YEAR = 2026;
const DST_END_UTC = new Date('2026-11-01T00:00:00Z').getTime(); // CDT -> CST switch

let currentMember = null;
let appMode = 'picks';

/* ---------- shared week helper ---------- */
function getDefaultWeek() {
  const seasonStart = new Date('2026-09-10T00:00:00Z');
  const now = new Date();
  const diffWeeks = Math.floor((now - seasonStart) / (7*24*60*60*1000)) + 1;
  return Math.min(Math.max(diffWeeks, 1), 18);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- AUTH / MEMBERS ---------- */

async function login() {
  const raw = document.getElementById('loginInput').value.trim();
  if (!raw) return;
  const username = raw;
  const lower = username.toLowerCase();

  let { data: existing, error } = await sb.from('dreamteam_members').select('*');
  if (error) { toast('Error: ' + error.message); return; }

  let match = existing.find(m => m.username.toLowerCase() === lower);
  if (!match) {
    const { data: created, error: cErr } = await sb.from('dreamteam_members')
      .insert({ username }).select().single();
    if (cErr) { toast('Error creating user: ' + cErr.message); return; }
    match = created;
  }
  currentMember = match;
  localStorage.setItem('dreamteam_username', match.username);
  enterApp();
}

function enterApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('userbox').innerHTML = `Playing as <b>${currentMember.username}</b>`;
  document.getElementById('survivorNoLogin').classList.add('hidden');
  document.getElementById('survivorMyContent').classList.remove('hidden');
  setMode('picks');
}

async function tryAutoLogin() {
  const saved = localStorage.getItem('dreamteam_username');
  if (!saved) return;
  const { data } = await sb.from('dreamteam_members').select('*').ilike('username', saved);
  if (data && data.length) {
    currentMember = data[0];
    enterApp();
  }
}

/* ---------- MODE SWITCH ---------- */

function toggleModeMenu() {
  document.getElementById('modeMenu').classList.toggle('hidden');
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('modeMenu');
  if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !e.target.closest('.hamburger')) {
    menu.classList.add('hidden');
  }
});

function setMode(mode) {
  appMode = mode;
  document.getElementById('modeMenu').classList.add('hidden');
  document.getElementById('pickNav').classList.add('hidden');
  document.getElementById('survivorNav').classList.add('hidden');
  document.getElementById('picksTab').classList.add('hidden');
  document.getElementById('leaderboardTab').classList.add('hidden');
  document.getElementById('adminTab').classList.add('hidden');
  document.getElementById('survivorMyTab').classList.add('hidden');
  document.getElementById('survivorFieldTab').classList.add('hidden');

  if (mode === 'picks') {
    document.getElementById('appTitle').textContent = 'Dreamteam Picks';
    document.getElementById('pickNav').classList.remove('hidden');
    showTab('picks');
  } else if (mode === 'survivor') {
    document.getElementById('appTitle').textContent = 'Dreamteam Survivor';
    document.getElementById('survivorNav').classList.remove('hidden');
    if (!currentMember) {
      document.getElementById('survivorNoLogin').classList.remove('hidden');
      document.getElementById('survivorMyContent').classList.add('hidden');
    }
    showSurvivorTab('survivorMy');
  } else if (mode === 'commish') {
    document.getElementById('appTitle').textContent = 'Dreamteam Commish';
    document.getElementById('adminTab').classList.remove('hidden');
  }
}

/* ---------- PICKS NAV ---------- */

let currentWeek = getDefaultWeek();
let adminWeek = currentWeek;
let gamesCache = [];
let picksCache = {};
let adminGamesCache = [];
let isAdmin = false;

document.getElementById('pickNav').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') showTab(e.target.dataset.tab);
});

function showTab(tab) {
  document.querySelectorAll('#pickNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['picks','leaderboard'].forEach(t => {
    document.getElementById(t+'Tab').classList.toggle('hidden', t !== tab);
  });
  if (tab === 'picks') loadWeek(currentWeek);
  if (tab === 'leaderboard') loadLeaderboard();
}

function changeWeek(delta) {
  currentWeek = Math.min(Math.max(currentWeek + delta, 1), 18);
  loadWeek(currentWeek);
}

async function loadWeek(week) {
  document.getElementById('weekLabel').textContent = 'Week ' + week;
  const { data: games, error } = await sb.from('dreamteam_games')
    .select('*').eq('week_num', week).eq('season_year', SEASON_YEAR).order('kickoff');
  if (error) { toast('Error loading games: ' + error.message); return; }
  gamesCache = games || [];

  picksCache = {};
  if (currentMember && gamesCache.length) {
    const gameIds = gamesCache.map(g => g.id);
    const { data: picks } = await sb.from('dreamteam_picks')
      .select('*').eq('member_id', currentMember.id).in('game_id', gameIds);
    (picks || []).forEach(p => picksCache[p.game_id] = p);
  }
  renderGames();
}

function fmtSpread(n) {
  if (n === 0) return 'PK';
  return n > 0 ? '+' + n : String(n);
}

function renderGames() {
  const el = document.getElementById('gamesList');
  if (!gamesCache.length) {
    el.innerHTML = '<div class="empty">No games loaded for this week yet.</div>';
    return;
  }
  const now = new Date();
  el.innerHTML = gamesCache.map(g => {
    const locked = new Date(g.kickoff) <= now;
    const isFinal = g.status === 'final';
    const pick = picksCache[g.id];
    const homeSpread = g.spread;
    const awaySpread = -g.spread;

    let homeResultClass = '', awayResultClass = '';
    if (isFinal && g.home_score != null && g.away_score != null) {
      const margin = g.home_score - g.away_score;
      const homeCovered = margin + homeSpread > 0 ? 'home' : (margin + homeSpread < 0 ? 'away' : 'push');
      if (pick && homeCovered !== 'push') {
        if (pick.pick_side === homeCovered) {
          if (pick.pick_side === 'home') homeResultClass = 'win'; else awayResultClass = 'win';
        } else {
          if (pick.pick_side === 'home') homeResultClass = 'loss'; else awayResultClass = 'loss';
        }
      }
    }

    const homeSelected = pick && pick.pick_side === 'home' ? 'selected' : '';
    const awaySelected = pick && pick.pick_side === 'away' ? 'selected' : '';
    const lockedClass = locked ? 'locked' : '';

    return `
      <div class="game">
        <div class="game-meta">
          <span>${new Date(g.kickoff).toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</span>
          ${locked ? '<span class="tag locked">LOCKED</span>' : ''}
          ${isFinal ? `<span class="tag locked">FINAL ${g.away_score}-${g.home_score}</span>` : ''}
        </div>
        <div class="pick-row">
          <button class="pick-btn ${awaySelected} ${lockedClass} ${awayResultClass}"
            ${locked ? 'disabled' : ''} onclick="makePick('${g.id}','away')">
            <b>${g.away_team}</b> ${fmtSpread(awaySpread)}
          </button>
          <button class="pick-btn ${homeSelected} ${lockedClass} ${homeResultClass}"
            ${locked ? 'disabled' : ''} onclick="makePick('${g.id}','home')">
            <b>${g.home_team}</b> ${fmtSpread(homeSpread)}
          </button>
        </div>
      </div>`;
  }).join('');
}

async function makePick(gameId, side) {
  if (!currentMember) return;
  const game = gamesCache.find(g => g.id === gameId);
  if (!game) return;
  if (new Date(game.kickoff) <= new Date()) { toast('Game is locked'); return; }

  const existing = picksCache[gameId];
  if (existing) {
    const { error } = await sb.from('dreamteam_picks')
      .update({ pick_side: side, locked_spread: game.spread, updated_at: new Date().toISOString() })
      .eq('id', existing.id);
    if (error) { toast('Error: ' + error.message); return; }
    picksCache[gameId] = { ...existing, pick_side: side };
  } else {
    const { data, error } = await sb.from('dreamteam_picks')
      .insert({ member_id: currentMember.id, game_id: gameId, pick_side: side, locked_spread: game.spread })
      .select().single();
    if (error) { toast('Error: ' + error.message); return; }
    picksCache[gameId] = data;
  }
  renderGames();
}

/* ---------- LEADERBOARD ---------- */

async function loadLeaderboard() {
  const { data: members, error: mErr } = await sb.from('dreamteam_members').select('*');
  if (mErr) return;
  const { data: games, error: gErr } = await sb.from('dreamteam_games')
    .select('*').eq('season_year', SEASON_YEAR).eq('status', 'final');
  if (gErr) return;
  const finalGameIds = games.map(g => g.id);
  const gameById = Object.fromEntries(games.map(g => [g.id, g]));

  let picks = [];
  if (finalGameIds.length) {
    const { data: p } = await sb.from('dreamteam_picks').select('*').in('game_id', finalGameIds);
    picks = p || [];
  }

  const stats = Object.fromEntries(members.map(m => [m.id, { username: m.username, pts: 0, wins: 0, losses: 0, pushes: 0 }]));

  picks.forEach(p => {
    const g = gameById[p.game_id];
    if (!g || g.home_score == null || g.away_score == null) return;
    const margin = g.home_score - g.away_score;
    const homeCovered = margin + g.spread > 0 ? 'home' : (margin + g.spread < 0 ? 'away' : 'push');
    const s = stats[p.member_id];
    if (!s) return;
    if (homeCovered === 'push') { s.pushes++; return; }
    if (p.pick_side === homeCovered) { s.pts += 1; s.wins++; }
    else { s.losses++; }
  });

  const sorted = Object.values(stats).sort((a,b) => b.pts - a.pts);
  const tbody = document.querySelector('#leaderboardTable tbody');
  tbody.innerHTML = sorted.map((s, i) => `
    <tr>
      <td class="rank">${i+1}</td>
      <td>${s.username}</td>
      <td class="center"><b>${s.pts}</b></td>
      <td class="center">${s.wins}-${s.losses}-${s.pushes}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="empty">No results yet</td></tr>';
}

/* ---------- ADMIN ---------- */

function adminLogin() {
  const pw = document.getElementById('adminPass').value;
  if (pw === ADMIN_PASSWORD) {
    isAdmin = true;
    document.getElementById('adminLocked').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    loadAdminWeekGames();
  } else {
    toast('Wrong password');
  }
}

function changeAdminWeek(delta) {
  adminWeek = Math.min(Math.max(adminWeek + delta, 1), 18);
  loadAdminWeekGames();
}

async function loadAdminWeekGames() {
  document.getElementById('adminWeekLabel').textContent = 'Week ' + adminWeek;
  const { data } = await sb.from('dreamteam_games')
    .select('*').eq('week_num', adminWeek).eq('season_year', SEASON_YEAR).order('kickoff');
  adminGamesCache = data || [];
  renderAdminGames();
}

function renderAdminGames() {
  const el = document.getElementById('adminGamesList');
  if (!adminGamesCache.length) {
    el.innerHTML = '<div class="empty">No games imported for this week yet.</div>';
    return;
  }
  el.innerHTML = adminGamesCache.map(g => `
    <div class="admin-game-row">
      <span>${g.away_team} @ ${g.home_team}</span>
      <span style="color:var(--muted)">${new Date(g.kickoff).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>
      <input type="number" step="0.5" value="${g.spread}" data-game-id="${g.id}" style="margin:0" placeholder="home spread">
      <span style="color:var(--muted);font-size:11px">home spread</span>
    </div>
  `).join('');
}

async function saveSpreads() {
  const inputs = document.querySelectorAll('#adminGamesList input[data-game-id]');
  let count = 0;
  for (const input of inputs) {
    const gameId = input.dataset.gameId;
    const val = parseFloat(input.value);
    if (isNaN(val)) continue;
    const { error } = await sb.from('dreamteam_games').update({ spread: val }).eq('id', gameId);
    if (!error) count++;
  }
  toast(`Saved ${count} spreads`);
  loadAdminWeekGames();
}

function weekDateRange(week) {
  const seasonStart = new Date('2026-09-08T00:00:00Z');
  const start = new Date(seasonStart.getTime() + (week-1)*7*24*60*60*1000);
  const end = new Date(start.getTime() + 7*24*60*60*1000);
  const fmt = d => d.toISOString().slice(0,10).replace(/-/g,'');
  return `${fmt(start)}-${fmt(end)}`;
}

async function importEspnWeek() {
  const status = document.getElementById('importStatus');
  status.textContent = 'Fetching from ESPN...';
  try {
    const dates = weekDateRange(adminWeek);
    const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${dates}&limit=100`;
    const res = await fetch(url);
    const json = await res.json();
    const events = json.events || [];
    if (!events.length) { status.textContent = 'No games found for this date range.'; return; }

    let imported = 0, skipped = 0;
    for (const ev of events) {
      const comp = ev.competitions[0];
      const home = comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors.find(c => c.homeAway === 'away');
      const espnId = ev.id;
      let spread = 0;
      if (comp.odds && comp.odds.length && comp.odds[0].spread != null) {
        spread = comp.odds[0].spread;
      }

      const { data: existing } = await sb.from('dreamteam_games').select('id').eq('espn_event_id', espnId);
      if (existing && existing.length) { skipped++; continue; }

      const { error } = await sb.from('dreamteam_games').insert({
        espn_event_id: espnId,
        week_num: adminWeek,
        season_year: SEASON_YEAR,
        home_team: home.team.displayName,
        away_team: away.team.displayName,
        spread: spread,
        kickoff: ev.date,
        status: 'scheduled'
      });
      if (!error) imported++;
    }
    status.textContent = `Imported ${imported} games, skipped ${skipped} already present.`;
    loadAdminWeekGames();
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}

async function refreshScoresAndGrade() {
  const status = document.getElementById('gradeStatus');
  status.textContent = 'Fetching live scores...';
  try {
    const dates = weekDateRange(adminWeek);
    const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${dates}&limit=100`;
    const res = await fetch(url);
    const json = await res.json();
    const events = json.events || [];
    let updated = 0;

    for (const ev of events) {
      const comp = ev.competitions[0];
      const home = comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors.find(c => c.homeAway === 'away');
      const stateType = comp.status.type.state;
      const status_ = stateType === 'post' ? 'final' : (stateType === 'in' ? 'in_progress' : 'scheduled');

      const homeScore = validScore(home.score);
      const awayScore = validScore(away.score);

      const { error } = await sb.from('dreamteam_games')
        .update({ home_score: homeScore, away_score: awayScore, status: status_ })
        .eq('espn_event_id', ev.id);
      if (!error) updated++;
    }
    status.textContent = `Updated ${updated} games. Leaderboard reflects final games automatically.`;
    loadLeaderboard();
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}

function validScore(s) {
  if (s === undefined || s === null) return null;
  const str = String(s).trim();
  if (str === '' || str.includes('–') || (str.includes('-') && str.length === 1)) return null;
  const n = parseInt(str, 10);
  return isNaN(n) ? null : n;
}

/* ============ SURVIVOR MODE ============ */

let survivorAllGames = [];
let survivorGamesById = {};
let survivorGamesByWeek = {};
let survivorMyPicks = {};       // week_num -> pick row
let survivorMyPicksList = [];
let survivorEditWeek = null;
let survivorSelection = null;   // {gameId, side, team}
let survivorUserClosedPicker = false;
let survivorFieldMembers = [];
let survivorFieldPicks = [];

document.getElementById('survivorNav').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') showSurvivorTab(e.target.dataset.tab);
});

function showSurvivorTab(tab) {
  document.querySelectorAll('#survivorNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('survivorMyTab').classList.toggle('hidden', tab !== 'survivorMy');
  document.getElementById('survivorFieldTab').classList.toggle('hidden', tab !== 'survivorField');
  if (tab === 'survivorMy') openSurvivorMy();
  if (tab === 'survivorField') loadSurvivorField();
}

function shortTeam(name) {
  if (!name) return '';
  const parts = name.trim().split(' ');
  return parts[parts.length - 1];
}

async function loadSurvivorGames() {
  const { data, error } = await sb.from('dreamteam_games').select('*').eq('season_year', SEASON_YEAR).order('kickoff');
  if (error) { toast('Error: ' + error.message); return; }
  survivorAllGames = data || [];
  survivorGamesById = {};
  survivorGamesByWeek = {};
  survivorAllGames.forEach(g => {
    survivorGamesById[g.id] = g;
    (survivorGamesByWeek[g.week_num] ||= []).push(g);
  });
}

async function loadSurvivorMyPicks() {
  const { data, error } = await sb.from('dreamteam_survivor_picks')
    .select('*').eq('member_id', currentMember.id).eq('season_year', SEASON_YEAR);
  if (error) { toast('Error: ' + error.message); return; }
  survivorMyPicksList = data || [];
  survivorMyPicks = {};
  survivorMyPicksList.forEach(p => survivorMyPicks[p.week_num] = p);
}

async function openSurvivorMy() {
  if (!currentMember) {
    document.getElementById('survivorNoLogin').classList.remove('hidden');
    document.getElementById('survivorMyContent').classList.add('hidden');
    return;
  }
  document.getElementById('survivorNoLogin').classList.add('hidden');
  document.getElementById('survivorMyContent').classList.remove('hidden');

  await loadSurvivorGames();
  await loadSurvivorMyPicks();

  const defWeek = getDefaultWeek();
  if (!survivorUserClosedPicker && survivorEditWeek === null && !survivorMyPicks[defWeek]) {
    survivorEditWeek = defWeek;
  }
  renderSurvivorMy();
}

function computeSurvivorStatusForMember(memberId, picksList, gamesById) {
  const sorted = picksList.slice().sort((a, b) => a.week_num - b.week_num);
  for (const p of sorted) {
    const g = gamesById[p.game_id];
    if (!g || g.status !== 'final' || g.home_score == null || g.away_score == null) break;
    const tie = g.home_score === g.away_score;
    if (tie) continue;
    const pickedHome = p.picked_team === g.home_team;
    const won = pickedHome ? g.home_score > g.away_score : g.away_score > g.home_score;
    if (!won) return { status: 'eliminated', outWeek: p.week_num };
  }
  return { status: 'alive', outWeek: null };
}

function survivorConstraints(picksList, excludeWeek) {
  const used = new Set();
  const against = {};
  picksList.forEach(p => {
    if (p.week_num === excludeWeek) return;
    used.add(p.picked_team);
    const g = survivorGamesById[p.game_id];
    if (!g) return;
    const opp = p.picked_team === g.home_team ? g.away_team : g.home_team;
    against[opp] = (against[opp] || 0) + 1;
  });
  return { used, against };
}

function renderSurvivorMy() {
  const status = computeSurvivorStatusForMember(currentMember.id, survivorMyPicksList, survivorGamesById);
  document.getElementById('survivorStatusBanner').innerHTML = status.status === 'eliminated'
    ? `<span style="color:var(--danger)">Eliminated — Week ${status.outWeek}</span>`
    : `<span style="color:var(--accent)">Alive</span>`;

  const now = new Date();
  let sheetHtml = '';
  for (let w = 1; w <= 18; w++) {
    const pick = survivorMyPicks[w];
    const game = pick ? survivorGamesById[pick.game_id] : null;
    const locked = game && new Date(game.kickoff) <= now;
    let resultClass = '';
    if (game && game.status === 'final' && game.home_score != null && pick) {
      const tie = game.home_score === game.away_score;
      if (!tie) {
        const pickedHome = pick.picked_team === game.home_team;
        const won = pickedHome ? game.home_score > game.away_score : game.away_score > game.home_score;
        resultClass = won ? 'win' : 'loss';
      }
    }
    sheetHtml += `<div class="survivor-card ${resultClass}">
        <div class="sc-week">Wk ${w}</div>
        <div class="sc-team">${pick ? shortTeam(pick.picked_team) : '—'}</div>
        <button class="secondary" ${locked ? 'disabled' : ''} onclick="editSurvivorWeek(${w})">${pick ? (locked ? 'Locked' : 'Edit') : 'Pick'}</button>
      </div>`;
  }
  document.getElementById('survivorSheet').innerHTML = sheetHtml;

  const pickerEl = document.getElementById('survivorPicker');
  if (survivorEditWeek === null) {
    pickerEl.classList.add('hidden');
  } else {
    pickerEl.classList.remove('hidden');
    renderSurvivorPickerGames(survivorEditWeek);
  }
}

function editSurvivorWeek(w) {
  survivorUserClosedPicker = false;
  survivorEditWeek = w;
  survivorSelection = null;
  renderSurvivorMy();
  document.getElementById('survivorPicker').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelSurvivorEdit() {
  survivorUserClosedPicker = true;
  survivorEditWeek = null;
  survivorSelection = null;
  renderSurvivorMy();
}

function renderSurvivorPickerGames(week) {
  document.getElementById('survivorPickerWeekLabel').textContent = 'Week ' + week;
  const games = (survivorGamesByWeek[week] || []).slice().sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
  const cons = survivorConstraints(survivorMyPicksList, week);
  const existingPick = survivorMyPicks[week];
  if (!survivorSelection && existingPick) {
    const g = survivorGamesById[existingPick.game_id];
    survivorSelection = {
      gameId: existingPick.game_id,
      side: g && existingPick.picked_team === g.home_team ? 'home' : 'away',
      team: existingPick.picked_team
    };
  }
  const now = new Date();
  const el = document.getElementById('survivorGamesList');
  if (!games.length) { el.innerHTML = '<div class="empty">No games loaded for this week.</div>'; return; }

  el.innerHTML = games.map(g => {
    const locked = new Date(g.kickoff) <= now;
    const sides = [
      { side: 'away', team: g.away_team, opp: g.home_team },
      { side: 'home', team: g.home_team, opp: g.away_team }
    ];
    return `<div class="game">
      <div class="game-meta">
        <span>${new Date(g.kickoff).toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</span>
        ${locked ? '<span class="tag locked">LOCKED</span>' : ''}
      </div>
      <div class="pick-row">
        ${sides.map(s => {
          const isCurrentPick = existingPick && existingPick.picked_team === s.team;
          const usedUp = cons.used.has(s.team) && !isCurrentPick;
          const againstBlocked = (cons.against[s.opp] || 0) >= 2 && !isCurrentPick;
          const disabled = locked || usedUp || againstBlocked;
          const selected = survivorSelection && survivorSelection.gameId === g.id && survivorSelection.side === s.side;
          const note = usedUp ? 'Already used' : (againstBlocked ? 'Picked against 2x' : '');
          const teamEsc = s.team.replace(/'/g, "\\'");
          return `<button class="pick-btn ${selected ? 'selected' : ''}" ${disabled ? 'disabled' : ''}
            onclick="selectSurvivorPick('${g.id}','${s.side}','${teamEsc}')">
            <b>${s.team}</b>${note ? `<span style="font-size:11px;color:var(--muted)">${note}</span>` : ''}
          </button>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function selectSurvivorPick(gameId, side, team) {
  survivorSelection = { gameId, side, team };
  renderSurvivorPickerGames(survivorEditWeek);
}

async function saveSurvivorPick() {
  if (!survivorSelection) { toast('Pick a team first'); return; }
  const week = survivorEditWeek;
  const payload = {
    member_id: currentMember.id,
    week_num: week,
    season_year: SEASON_YEAR,
    game_id: survivorSelection.gameId,
    picked_team: survivorSelection.team,
    updated_at: new Date().toISOString()
  };
  const { data, error } = await sb.from('dreamteam_survivor_picks')
    .upsert(payload, { onConflict: 'member_id,week_num,season_year' })
    .select().single();
  if (error) { toast('Error: ' + error.message); return; }

  survivorMyPicks[week] = data;
  const idx = survivorMyPicksList.findIndex(p => p.week_num === week);
  if (idx >= 0) survivorMyPicksList[idx] = data; else survivorMyPicksList.push(data);

  survivorSelection = null;
  survivorEditWeek = null;
  survivorUserClosedPicker = true;
  toast('Pick saved');
  renderSurvivorMy();
}

/* ---------- Survivor Field (matrix) ---------- */

async function loadSurvivorField() {
  await loadSurvivorGames();
  const { data: members } = await sb.from('dreamteam_members').select('*');
  survivorFieldMembers = members || [];
  const { data: picks } = await sb.from('dreamteam_survivor_picks').select('*').eq('season_year', SEASON_YEAR);
  survivorFieldPicks = picks || [];
  renderSurvivorField();
}

// Finds the Sunday of a given week's slate (America/Chicago) and returns 12:00pm Central as a Date.
function sundayNoonThresholdForWeek(week) {
  const games = survivorGamesByWeek[week] || [];
  if (!games.length) return null;
  let sundayDateStr = null;
  for (const g of games) {
    const d = new Date(g.kickoff);
    const wd = d.toLocaleDateString('en-US', { timeZone: 'America/Chicago', weekday: 'short' });
    if (wd === 'Sun') {
      sundayDateStr = d.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
      break;
    }
  }
  if (!sundayDateStr) {
    // no Sunday game found (rare) — fall back to earliest kickoff of the week
    return new Date(Math.min(...games.map(g => new Date(g.kickoff).getTime())));
  }
  const noonUtcGuess = new Date(sundayDateStr + 'T12:00:00Z').getTime();
  const offset = noonUtcGuess < DST_END_UTC ? '-05:00' : '-06:00'; // CDT vs CST
  return new Date(sundayDateStr + 'T12:00:00' + offset);
}

function isSurvivorPickRevealed(pick, week) {
  if (!pick) return false;
  const now = new Date();
  const threshold = sundayNoonThresholdForWeek(week);
  if (threshold && now >= threshold) return true;
  const game = survivorGamesById[pick.game_id];
  if (game && new Date(game.kickoff) <= now) return true;
  return false;
}

function renderSurvivorField() {
  const el = document.getElementById('survivorFieldTable');
  const weeks = Array.from({ length: 18 }, (_, i) => i + 1);
  const head = '<tr><th>Member</th><th>Status</th>' + weeks.map(w => `<th class="center">${w}</th>`).join('') + '</tr>';

  const rows = survivorFieldMembers.map(m => {
    const myPicks = survivorFieldPicks.filter(p => p.member_id === m.id);
    const status = computeSurvivorStatusForMember(m.id, myPicks, survivorGamesById);
    const statusLabel = status.status === 'eliminated' ? `Out Wk${status.outWeek}` : 'Alive';
    const statusColor = status.status === 'eliminated' ? 'var(--danger)' : 'var(--accent)';

    const cells = weeks.map(w => {
      const pick = myPicks.find(p => p.week_num === w);
      if (!pick) return '<td class="center">—</td>';
      if (!isSurvivorPickRevealed(pick, w)) return '<td class="center">🔒</td>';
      const game = survivorGamesById[pick.game_id];
      let style = '';
      if (game && game.status === 'final' && game.home_score != null) {
        const tie = game.home_score === game.away_score;
        if (!tie) {
          const pickedHome = pick.picked_team === game.home_team;
          const won = pickedHome ? game.home_score > game.away_score : game.away_score > game.home_score;
          style = `style="color:${won ? 'var(--accent)' : 'var(--danger)'}"`;
        }
      }
      return `<td class="center" ${style}>${shortTeam(pick.picked_team)}</td>`;
    }).join('');

    return `<tr><td>${m.username}</td><td style="color:${statusColor}">${statusLabel}</td>${cells}</tr>`;
  }).join('');

  el.innerHTML = `<table><thead>${head}</thead><tbody>${rows || `<tr><td colspan="20" class="empty">No members yet</td></tr>`}</tbody></table>`;
}
